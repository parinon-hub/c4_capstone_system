<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activities - Organization Portal</title>
  <link rel="icon" type="image/png" href="../../assets/img/favicon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">
  <link rel="stylesheet" href="../../assets/css/saso-theme.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">

<div class="wrapper" id="appWrapper">
  <div class="content-wrapper">
    <div id="pageHeader"></div>

    <section class="content">
      <div class="container-fluid">

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">All activities</h3>
            <div class="card-tools">
              <a href="submit-activity.html" class="btn btn-sm btn-primary">
                <i class="fa-solid fa-circle-plus mr-1"></i>Submit activity</a>
            </div>
          </div>

          <div class="card-body border-bottom py-2">
            <!-- Search, then Sort and Filter menus laid out like a file manager's toolbar. -->
            <div class="list-toolbar">
              <div class="list-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" class="form-control form-control-sm" id="fSearch"
                       placeholder="Search activity title or venue" aria-label="Search activities">
              </div>
              <div class="dropdown">
                <button type="button" class="btn btn-sm btn-outline-secondary list-tool" id="btnSort"
                        data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                  <i class="fa-solid fa-arrow-down-wide-short mr-1"></i>Sort
                  <i class="fa-solid fa-chevron-down ml-1 list-tool-caret"></i></button>
                <div class="dropdown-menu dropdown-menu-right list-menu" id="sortMenu" aria-labelledby="btnSort"></div>
              </div>
              <div class="dropdown">
                <button type="button" class="btn btn-sm btn-outline-secondary list-tool" id="btnFilter"
                        data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                  <i class="fa-solid fa-filter mr-1"></i>Filter<span id="filterCount"></span>
                  <i class="fa-solid fa-chevron-down ml-1 list-tool-caret"></i></button>
                <div class="dropdown-menu dropdown-menu-right list-menu list-menu-wide" id="filterMenu"
                     aria-labelledby="btnFilter"></div>
              </div>
              <button type="button" class="btn btn-sm btn-light list-tool" id="btnClear">Clear</button>
            </div>
            <div class="list-chips" id="activeChips"></div>
          </div>

          <div class="card-body p-0" id="activitiesTable"></div>

          <div class="card-footer d-flex align-items-center py-2" id="pager"></div>
        </div>

      </div>
    </section>
  </div>

  <footer class="main-footer text-sm">
    <strong>CSPC SASO Student Organization Activity Monitoring</strong> (front-end prototype).
    <span class="float-right text-muted">Organization names and accreditation levels follow the published CSPC roster; officers, advisers and all activity records are simulated.</span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/js/adminlte.min.js"></script>

<script>window.SASO_BASE = '../../';</script>
<script src="../../assets/js/core/config.js"></script>
<script src="../../data/seed.js"></script>
<script src="../../assets/js/core/storage.js"></script>
<script src="../../assets/js/core/model.js"></script>
<script src="../../assets/js/core/events.js"></script>
<script src="../../assets/js/core/auth.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/core/listview.js"></script>
<script src="../../assets/js/core/proposal-actions.js"></script>
<script src="../../assets/js/pages/org-activities.js"></script>
</body>
</html>
