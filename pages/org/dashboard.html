<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Organization Portal</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">
  <link rel="stylesheet" href="../../assets/css/saso-theme.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">

<div class="wrapper" id="appWrapper">
  <!-- navbar and sidebar are injected here by layout.js -->

  <div class="content-wrapper">
    <div id="pageHeader"></div>

    <section class="content">
      <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
          <div id="orgIdentity"></div>
          <a href="#" id="btnSubmitActivity" class="btn btn-primary">
            <i class="fa-solid fa-circle-plus mr-1"></i> Submit activity
          </a>
        </div>

        <div class="row" id="statTiles"></div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">My activities</h3>
            <div class="card-tools">
              <a href="#" id="linkAllActivities" class="btn btn-sm btn-outline-primary">See all</a>
            </div>
          </div>
          <div class="card-body p-0" id="activitiesTable"></div>
        </div>

        <div class="card">
          <div class="card-header"><h3 class="card-title">Recent updates</h3></div>
          <div class="card-body p-0" id="recentNotifications"></div>
        </div>

      </div>
    </section>
  </div>

  <footer class="main-footer text-sm">
    <strong>CSPC SASO Student Organization Activity Monitoring</strong> — front-end prototype.
    <span class="float-right text-muted">Organization names and accreditation levels follow the published CSPC roster; officers, advisers and all activity records are simulated.</span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/js/adminlte.min.js"></script>

<script>window.SASO_BASE = '../../';</script>
<script src="../../assets/js/core/config.js"></script>
<script src="../../data/seed.js"></script>
<script src="../../assets/js/core/storage.js"></script>
<script src="../../assets/js/core/model.js"></script>
<script src="../../assets/js/core/events.js"></script>
<script src="../../assets/js/core/auth.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/pages/org-dashboard.js"></script>
</body>
</html>
